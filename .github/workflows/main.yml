name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 10 * * 1,4"  # Monday + Thursday (2x/week)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/transactions?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
